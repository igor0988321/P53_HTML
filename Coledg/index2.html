<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Анкета студента</title>
    <link rel="stylesheet" href="style.css">
<style>

    body {
        font-family: Arial, sans-serif;
        background-color: #f0f0f0;
        display: flex;
        justify-content: center;
        padding: 20px;
    }

    .student-form {
        background: white;
        width: 450px;
        border-radius: 10px;
        border: 1px solid #f8d7da;
        overflow: hidden;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    .form-header {
        background-color: #d64b56;
        color: white;
        padding: 15px;
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .form-header h2 {
        margin: 0;
        font-size: 18px;
    }

    fieldset {
        border: none;
        padding: 15px;
        margin: 0;
    }

    legend {
        width: 100%;
        background: #fff5f5;
        color: #333;
        font-weight: bold;
        padding: 5px 10px;
        margin-bottom: 10px;
        font-size: 14px;
        box-sizing: border-box;
    }

    label {
        display: block;
        font-size: 12px;
        font-weight: bold;
        margin-bottom: 5px;
        color: #444;
    }

    .row {
        display: flex;
        gap: 15px;
        margin-bottom: 10px;
    }

    .group {
        flex: 1;
    }

    input[type="text"],
    input[type="email"],
    input[type="date"],
    select,
    textarea {
        width: 100%;
        padding: 8px;
        border: 1px solid #ddd;
        border-radius: 4px;
        font-size: 13px;
        box-sizing: border-box;
    }

    .radio-group, .checkbox-group {
        display: flex;
        gap: 15px;
        margin-bottom: 10px;
        font-size: 13px;
    }

    .radio-group label, .checkbox-group label {
        font-weight: normal;
        display: flex;
        align-items: center;
        gap: 5px;
    }

    .file-input {
        margin-top: 5px;
    }

    .submit-btn {
        width: calc(100% - 30px);
        margin: 15px;
        background-color: #d64b56;
        color: white;
        border: none;
        padding: 12px;
        border-radius: 5px;
        cursor: pointer;
        font-weight: bold;
        transition: background 0.3s;
    }

    .submit-btn:hover {
        background-color: #b33a45;
    }

</style>
</head>
<body>

        <h2>Анкета студента</h2>
    </div>

    <fieldset>
        <legend>Особисті дані</legend>
        <div class="row">
            <div class="group">
                <label for="fname">Ім'я</label>
                <input type="text" id="fname" placeholder="Введіть ім'я">
            </div>
            <div class="group">
                <label for="lname">Прізвище</label>
                <input type="text" id="lname" placeholder="Введіть прізвище">
            </div>
        </div>
        <div class="row">
            <div class="group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="example@gmail.com">
            </div>
            <div class="group">
                <label for="dob">Дата народження</label>
                <input type="date" id="dob">
            </div>
        </div>
    </fieldset>

    <fieldset>
        <legend>Навчання</legend>
        <div class="row">
            <div class="group">
                <label for="faculty">Факультет</label>
                <select id="faculty">
                    <option>Інформаційні технології</option>
                    <option>Економіка</option>
                </select>
            </div>
            <div class="group">
                <label for="course">Курс</label>
                <select id="course">
                    <option>1 курс</option>
                    <option>2 курс</option>
                </select>
            </div>
        </div>
        <label>Форма навчання</label>
        <div class="radio-group">
            <label><input type="radio" name="mode" checked> Денна</label>
            <label><input type="radio" name="mode"> Заочна</label>
            <label><input type="radio" name="mode"> Вечірня</label>
        </div>
    </fieldset>

    <fieldset>
        <legend>Додаткова інформація</legend>
        <label>Навички (оберіть декілька)</label>
        <div class="checkbox-group">
<label><input type="checkbox" checked> HTML</label>
            <label><input type="checkbox" checked> CSS</label>
            <label><input type="checkbox" checked> JavaScript</label>
            <label><input type="checkbox"> Python</label>
        </div>
        
        <label for="comment">Коментар</label>

        <label>Фото або документ</label>
        <div class="file-input">
            <input type="file">
        </div>
    </fieldset>

    <button type="submit" class="submit-btn">Відправити анкету</button>
</form>

</body>
</html>
