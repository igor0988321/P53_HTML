<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Title</title>
        <style>
            body{
                background-color: #f0f0f0;
                font-family: Verdana;
                display: flex;
                justify-content: center;
                padding: 20px;
            }
            
            .cont{
                background: white;
                width: 100%;
                max-width: 1000px;
                border: 1px solid #ccc;
                
            }
            
            .content{
                padding: 40px;
                display: flex;
                flex-direction: column;
                gap: 30px;
            }
            
            h2{
                color: #555;
                font-weight: 400;
                margin-bottom: 25px;
            }
            
            .group{
                display: flex;
                align-items: center;
                margin-bottom: 20px;
                border-bottom: 1px solid #ccc;
            }
            
            .group img{
                width: 24px;
                margin-right: 15px;
            }
            
            input, select{
                border: none;
                padding: 10px 0;
                width: 100%;
                font-size: 14px;
            }
            
            .foot{
                border-top: 1px solid #eee;
                padding: 30px 40xp;
                background-color: #fafafa;
            }
            
            .box label{
                display: block;
                font-size: 13px;
                margin-bottom: 10px;
                color: #666;
            }
            
            .but{
                display: flex;
                justify-content: flex-end;
                margin-top: 20px;
            }
            
            
            .sub{
                background-color: #008b8b;
                color: white;
                border: none;
                padding: 10px 40px;
                cursor: pointer;
                font-weight: bold;
                border-radius: 3px;
            }
            
            @media screen and (min-width: 600px){
                .pass, .per{
                    display: flex;
                    gap: 20px;
                }
                
                .pass{
                    flex: 1;
                }
            }
            
            @media screen and (min-width: 900px){
                .content{
                    flex-direction: row;
                    align-items: flex-start;
                }
                
                .sect{
                    flex: 1;
                }  
            }
            
            
            
        </style>
    </head>
    <body>
        <div class="cont">
           <form>
                <div class="content">
                    <section class="sect">
                        <h2>Registration form</h2>
                        <div class="group">
                            <img src="png/icons_ht/username.png" alt="user" class="icon">
                            <input type="text" placeholder="Username">
                        </div>
                        
                        <div class="group">
                            <img src="png/icons_ht/email.png" alt="email" class="icon">
                            <input type="email" placeholder="Email address">
                        </div>
                        
                        <div class="pass">
                            <div class="group">
                                <img src="png/icons_ht/pswd.png" alt="lock" class="icon">
                                <input type="password" placeholder="Password">
                            </div>
                            <div class="group ic">
                                <input type="password" placeholder="Confirm password">
                            </div>
                        </div>
                    </section>
                    
                    <section class="sect">
                        <h2>Personal details</h2>
                        <div class="pers">
                            <input type="text" placeholder="First name">
                            <input type="text" placeholder="Last name">
                        </div>
                        
                        <div class="pers">
                            <select>
                                <option value="male">Male</option>
                                <option value="female">Female</option>
                            </select>
                            <input type="text" placeholder="mm/dd/yyyy">
                        </div>
                    </section>
                </div>
                
                <div class="foot">
                    <div class="box">
                        <label><input type="checkbox"> I want to receive news and special offers</label>
                        <label><input type="checkbox"> I agree with the Terms and Conditions</label>
                    </div>
                    <div class="but">
                        <button class="sub">Submit</button>
                    </div>
                </div>
                   
               
           </form>
            
        </div>
    </body>
</html>
